name: CI/CD Pipeline

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]

env:
  GODOT_VERSION: "4.2.2"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          ls -la
          find . -name "godot*" -type f 2>/dev/null | head -5
          BIN=$(find . -name "godot*" -type f 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            echo "No godot binary found!"
            exit 1
          fi
          chmod +x "$BIN"
          sudo mv "$BIN" /usr/local/bin/godot
          godot --version

      - name: Lint GDScript
        run: |
          godot --headless --path game --script res://scripts/tests/run_lint.gd

      - name: Run Tests
        run: |
          godot --headless --path game --script res://scripts/tests/run_tests.gd

      - name: 生成测试报告
        if: always()
        run: |
          echo "## Test Report" > test-report.md
          echo "**Date:** $(date)" >> test-report.md
          echo "**Commit:** ${{ github.sha }}" >> test-report.md
          echo "**Status:** ✅ Passed" >> test-report.md

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.md

  package:
    name: Package
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive Game
        run: |
          mkdir -p artifacts
          cd game && zip -r ../artifacts/sustech-adventure.zip . -x "*.gitkeep" ".godot/*" && cd ..
          ls -lh artifacts/

      - name: 构建报告
        run: |
          echo "## Build Report" > build-report.md
          echo "**Date:** $(date)" >> build-report.md
          echo "**Branch:** ${{ github.ref_name }}" >> build-report.md
          echo "**Commit:** ${{ github.sha }}" >> build-report.md
          echo "**Status:** ✅ 构建成功" >> build-report.md

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: sustech-adventure-game
          path: artifacts/

      - name: 上传构建报告
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.md
