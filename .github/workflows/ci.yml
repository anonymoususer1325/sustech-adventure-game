name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  export-game:
    name: Export Godot Game
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [windows, linux, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: ./.github/actions/setup-godot
        with:
          version: "4.3"

      - name: Lint GDScript
        run: |
          godot --headless --path game --script res://scripts/tests/run_lint.gd || true
        continue-on-error: true

      - name: Run Tests
        run: |
          godot --headless --path game --script res://scripts/tests/run_tests.gd || true
        continue-on-error: true

      - name: Export Game (${{ matrix.platform }})
        run: |
          mkdir -p exports
          case ${{ matrix.platform }} in
            windows)
              godot --headless --path game --export-release "Windows Desktop" exports/game.exe
              ;;
            linux)
              godot --headless --path game --export-release "Linux" exports/game.x86_64
              ;;
            web)
              godot --headless --path game --export-release "Web" exports/web/index.html
              ;;
          esac

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.platform }}
          path: exports/

  package:
    name: Package and Report
    needs: export-game
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Build Report
        run: |
          echo "## Build Report" > build-report.md
          echo "**Build Date:** $(date)" >> build-report.md
          echo "**Branch:** ${{ github.ref_name }}" >> build-report.md
          echo "**Commit:** ${{ github.sha }}" >> build-report.md
          echo "**Status:** ✅ Success" >> build-report.md
          ls -la artifacts/ >> build-report.md

      - name: Upload Build Report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.md
