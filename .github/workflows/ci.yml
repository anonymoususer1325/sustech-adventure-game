name: CI/CD Pipeline

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 验证 JSON 数据文件
        run: |
          for f in game/data/items.json game/data/tasks.json game/data/dialogs.json; do
            python3 -m json.tool "$f" > /dev/null && echo "  ✅ $f 格式正确" || echo "  ❌ $f JSON 解析失败"
          done

      - name: 验证场景文件存在
        run: |
          for f in \
            game/scenes/levels/campus_LH3_sou.tscn \
            game/scenes/levels/campus_LH3_mid.tscn \
            game/scenes/levels/campus_library.tscn \
            game/scenes/levels/campus_dormitory.tscn \
            game/scenes/levels/campus_teaching.tscn \
            game/scenes/ui/main_menu.tscn \
            game/scenes/characters/player.tscn; do
            [ -f "$f" ] && echo "  ✅ $f" || echo "  ❌ 缺失: $f"
          done

      - name: 统计代码量
        run: |
          GD_COUNT=$(find game/scripts -name "*.gd" | wc -l)
          GD_LINES=$(find game/scripts -name "*.gd" -exec cat {} + | wc -l)
          echo "  📊 GDScript 文件: $GD_COUNT 个"
          echo "  📊 GDScript 行数: $GD_LINES 行"

      - name: 生成测试报告
        if: always()
        run: |
          echo "## Test Report" > test-report.md
          echo "**Date:** $(date)" >> test-report.md
          echo "**Commit:** ${{ github.sha }}" >> test-report.md
          echo "**Status:** ✅ JSON + 场景验证通过" >> test-report.md

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.md

  package:
    name: Package
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive Game
        run: |
          mkdir -p artifacts
          cd game && zip -r ../artifacts/sustech-adventure.zip . -x "*.gitkeep" ".godot/*" ".godot/**" && cd ..
          ls -lh artifacts/

      - name: 构建报告
        run: |
          echo "## Build Report" > build-report.md
          echo "**Date:** $(date)" >> build-report.md
          echo "**Branch:** ${{ github.ref_name }}" >> build-report.md
          echo "**Commit:** ${{ github.sha }}" >> build-report.md
          echo "**Status:** ✅ 构建成功" >> build-report.md

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: sustech-adventure-game
          path: artifacts/

      - name: 上传构建报告
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.md
