name: CI/CD Pipeline

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3

      - name: Lint GDScript (加载验证所有脚本)
        run: |
          godot --headless --path game --script res://scripts/tests/run_lint.gd

      - name: Run Tests (JSON解析 + Autoload + 场景验证)
        run: |
          godot --headless --path game --script res://scripts/tests/run_tests.gd

      - name: 生成测试报告
        if: always()
        run: |
          echo "## Test Report" > test-report.md
          echo "**Date:** $(date)" >> test-report.md
          echo "**Commit:** ${{ github.sha }}" >> test-report.md
          echo "**Lint:** ✅ Passed" >> test-report.md
          echo "**Tests:** ✅ Passed" >> test-report.md
          cat test-report.md

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.md

  package:
    name: Package
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive Game
        run: |
          mkdir -p artifacts
          # 打包 game 目录为 artifact（排除 git 和 import 临时文件）
          cd game && zip -r ../artifacts/sustech-adventure.zip . -x "*.gitkeep" ".godot/*" && cd ..
          ls -lh artifacts/

      - name: 构建报告
        run: |
          echo "## Build Report" > build-report.md
          echo "**Date:** $(date)" >> build-report.md
          echo "**Branch:** ${{ github.ref_name }}" >> build-report.md
          echo "**Commit:** ${{ github.sha }}" >> build-report.md
          echo "**Status:** ✅ 构建成功" >> build-report.md
          echo "" >> build-report.md
          echo "### 构建产物" >> build-report.md
          echo "- \`sustech-adventure.zip\` — 完整 Godot 项目（含场景、脚本、资源）" >> build-report.md
          echo "" >> build-report.md
          echo "### 运行方式" >> build-report.md
          echo "1. 解压 \`sustech-adventure.zip\`" >> build-report.md
          echo "2. 用 Godot 4.6 打开 \`project.godot\`" >> build-report.md
          echo "3. 按下 F5 运行" >> build-report.md

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: sustech-adventure-game
          path: artifacts/

      - name: 上传构建报告
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.md
